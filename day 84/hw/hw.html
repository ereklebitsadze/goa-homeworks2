<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fridge Void Alliance</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #121214;
            color: #e4e4e7;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .fridge-card {
            background: #1c1c21;
            padding: 2.5rem;
            border-radius: 16px;
            text-align: center;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2e2e38;
        }
        h1 {
            color: #ffca28;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        p {
            color: #a1a1aa;
            font-size: 1rem;
            line-height: 1.5;
        }
        .light-bulb {
            font-size: 3rem;
            margin-bottom: 1rem;
            animation: flicker 2s infinite;
        }
        @keyframes flicker {
            0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
            20%, 24%, 55% { opacity: 0.5; }
        }
        button {
            background-color: #ffca28;
            color: #121214;
            border: none;
            padding: 0.75rem 1.5rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="fridge-card">
        <div class="light-bulb">💡</div>
        <h1>The Fridge Void</h1>
        <p>Did you come here for cheese? Leftover pizza? A glass of water? Nobody knows. The cold neon light has wiped your memory. You are one with the void now.</p>
        
        <button onclick="alert('Memory reset protocol initiated. Close the door and try walking into the room again.');">
            I Forgot What I Wanted
        </button>
    </div>

</body>
</html>
